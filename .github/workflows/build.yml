name: Gerar EXE Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pdfplumber pillow openpyxl PyQt6

    - name: Compilar com PyInstaller
      run: |
        pyinstaller --onefile --windowed --name ExtratorPDF9 col9.py

    - name: Salvar o executável
      uses: actions/upload-artifact@v4
      with:
        name: ExtratorPDF-Windows
        path: dist/ExtratorPDF9.exe
